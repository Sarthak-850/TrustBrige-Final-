# Netlify: static site, no build step.
[build]
  publish = "."
  command = ""

# Hash routing needs no rewrites, but a bad path should land on 404.html
# rather than the host's default page.
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # Everything is first-party and there are no inline <script> blocks.
    # 'unsafe-inline' is needed for style-src only: the UI uses inline style
    # attributes, and data: covers the CSS-embedded select arrow.
    # connect-src additionally allows the Stellar RPC/Horizon/Friendbot
    # endpoints the dApp calls. Keep in sync with serve.js and vercel.json.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://soroban-testnet.stellar.org https://horizon-testnet.stellar.org https://friendbot.stellar.org https://mainnet.sorobanrpc.com https://horizon.stellar.org; form-action 'none'; frame-ancestors 'none'; base-uri 'self'"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
